<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      // Mirrors apply() in src/providers/ThemeProvider.tsx; the ids come
      // from src/lib/themes.ts.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem('pulse:theme');
        } catch {
          // Blocked storage: follow the OS.
        }
        const dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <meta name="description" content="Health and activity across jbouder’s projects: commits, stars, releases and traffic, collected daily." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Pulse" />
    <meta property="og:description" content="Health and activity across jbouder’s projects." />
    <meta property="og:type" content="website" />
    <title>Pulse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
