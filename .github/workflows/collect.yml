name: Collect

on:
  schedule:
    - cron: '20 6 * * *'     # daily 06:20 UTC, after upstream stats roll over
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'sources.yaml'
      - 'pulse/**'
      - '.github/workflows/collect.yml'

# Queue rather than cancel: a run may be mid commit-and-push.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run pulse collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT that can read every tracked repo's traffic (push access).
          # Health, commits, stars and releases work without it.
          PULSE_GITHUB_TOKEN: ${{ secrets.PULSE_GITHUB_TOKEN }}
          # Worker requests: Account Analytics:Read on the Cloudflare
          # account. Skipped with a note when either is missing.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
      - name: Commit if changed
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            # The Actions bot's noreply address, so Pulse leaves its own data
            # commits out of the commit counts.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: collect $(date -u +%Y-%m-%d)"
            git push
            # A push made with GITHUB_TOKEN does not trigger other workflows,
            # so redeploy the dashboard explicitly.
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
